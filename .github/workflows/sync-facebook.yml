name: Синхронізація новин з Facebook

on:
  schedule:
    - cron: "23 4-18/2 * * *"   # кожні 2 години з 6:23 до 20:23 за Києвом (UTC+2)
  workflow_dispatch:            # кнопка "Run workflow" для ручного запуску
    inputs:
      pages:
        description: "Скільки сторінок дописів забрати (по 25). Для першого заповнення поставте 20."
        required: false
        default: "2"

permissions:
  contents: write
  pages: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Завантажити публікації
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_API_VERSION: ${{ vars.FB_API_VERSION }}
          FB_PAGES: ${{ github.event.inputs.pages || '2' }}
          FB_PHOTOS: ${{ vars.FB_PHOTOS }}
        run: node scripts/sync-facebook.mjs
      - name: Надіслати нові новини в месенджери
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIBER_AUTH_TOKEN: ${{ secrets.VIBER_AUTH_TOKEN }}
          VIBER_FROM: ${{ secrets.VIBER_FROM }}
        run: node scripts/notify-messengers.mjs
      - name: Зберегти зміни
        id: save
        run: |
          git config user.name "lyceum-bot"
          git config user.email "lyceum-bot@users.noreply.github.com"
          git add posts.json images data/notified.json 2>/dev/null || git add posts.json images
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Оновлення новин з Facebook"
            # якщо за цей час хтось зберіг зміни в адмін-панелі, підтягуємо їх і пробуємо ще раз
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Оновити сайт
        if: steps.save.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # коміти від бота не завжди самі запускають збирання GitHub Pages, тому просимо явно
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Не вдалося запустити збирання Pages (сайт оновиться з наступним комітом)."
